<div class="confirm-dialog">

  <h2 class="dialog-title">
    {{ data.title }}
  </h2>

  <p class="dialog-message">
    {{ data.message }}
  </p>

  <div class="dialog-actions">

    <button
      mat-button
      (click)="cancel()">

      {{ data.cancelText || 'Cancel' }}

    </button>

    <button
      mat-flat-button
      color="warn"
      (click)="confirm()">

      {{ data.confirmText || 'Delete' }}

    </button>

  </div>

</div>
