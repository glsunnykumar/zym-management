<section class="dashboard-section">

    <header class="dashboard-section__header">

        <div>

            <h2>{{ title() }}</h2>

            @if (subtitle()) {

                <p>{{ subtitle() }}</p>

            }

        </div>

        <div class="dashboard-section__actions">

            <ng-content select="[section-actions]" />

        </div>

    </header>

    <div class="dashboard-section__content">

        <ng-content />

    </div>

</section>
