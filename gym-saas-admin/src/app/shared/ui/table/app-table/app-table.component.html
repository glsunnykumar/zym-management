<div class="table-wrapper">

    @if(loading){

    <app-loading-overlay [config]="{
                variant:'section',
                message:'Loading...'
            }">
    </app-loading-overlay>

    } @else if(data.length === 0){

    <app-empty-state [config]="{
                title:'No Records Found',
                description:'There is nothing to display.'
            }">
    </app-empty-state>

    } @else {

    <table mat-table [dataSource]="data">

        @for(column of config.columns; track column.key){

        @if(!column.hidden){

        <ng-container [matColumnDef]="column.key.toString()">

            <th mat-header-cell *matHeaderCellDef>

                {{column.header}}

            </th>

            <td mat-cell *matCellDef="let row">

                <app-app-table-cell [row]="row" [column]="column">
                </app-app-table-cell>
            </td>

        </ng-container>

        }

        }

        @if(config.actions?.length){

        <ng-container matColumnDef="actions">

            <th mat-header-cell *matHeaderCellDef>

                Actions

            </th>

            <td mat-cell *matCellDef="let row">

                @for(action of config.actions; track action.id){

                <button mat-icon-button (click)="onAction(action, row)">
                    >

                    <mat-icon>

                        {{action.icon}}

                    </mat-icon>

                </button>

                }

            </td>

        </ng-container>

        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns">
        </tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;">
        </tr>

    </table>

    }

</div>
