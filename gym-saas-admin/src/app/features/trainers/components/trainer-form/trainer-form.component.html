<gf-form-card>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()">

    <!-- BASIC -->

    <gf-form-section
      title="Trainer Information"
      subtitle="Trainer personal details">

      <gf-form-grid>

        <mat-form-field appearance="outline">

          <mat-label>
            Full Name
          </mat-label>

          <input
            matInput
            formControlName="fullName">

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>
            Email
          </mat-label>

          <input
            matInput
            type="email"
            formControlName="email">

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>
            Phone
          </mat-label>

          <input
            matInput
            formControlName="phone">

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>
            Status
          </mat-label>

          <mat-select formControlName="status">

            <mat-option value="active">
              Active
            </mat-option>

            <mat-option value="inactive">
              Inactive
            </mat-option>

          </mat-select>

        </mat-form-field>

      </gf-form-grid>

    </gf-form-section>

    <!-- EMPLOYMENT -->

    <gf-form-section
      title="Employment Information"
      subtitle="Trainer role and compensation">

      <gf-form-grid>

        <mat-form-field appearance="outline">

          <mat-label>
            Specialization
          </mat-label>

          <input
            matInput
            formControlName="specialization">

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>
            Salary
          </mat-label>

          <input
            matInput
            type="number"
            formControlName="salary">

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>
            Joining Date
          </mat-label>

          <input
            matInput
            [matDatepicker]="picker"
            formControlName="joiningDate">

          <mat-datepicker-toggle
            matSuffix
            [for]="picker">
          </mat-datepicker-toggle>

          <mat-datepicker
            #picker>
          </mat-datepicker>

        </mat-form-field>

      </gf-form-grid>

    </gf-form-section>

    <!-- ADDITIONAL -->

    <gf-form-section
      title="Additional Information">

      <mat-form-field appearance="outline">

        <mat-label>
          Notes
        </mat-label>

        <textarea
          matInput
          rows="4"
          formControlName="notes">
        </textarea>

      </mat-form-field>

    </gf-form-section>

    <gf-form-actions>

      <button
        type="button"
        mat-stroked-button
        (click)="cancel.emit()">

        Cancel

      </button>

      <button
        type="submit"
        mat-flat-button
        color="primary">

        {{ trainer ? 'Update Trainer' : 'Create Trainer' }}

      </button>

    </gf-form-actions>

  </form>

</gf-form-card>
