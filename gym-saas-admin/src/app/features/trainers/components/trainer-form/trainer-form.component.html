<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="trainer-form">

  <div class="grid">

    <mat-form-field appearance="outline">
      <mat-label>Full Name</mat-label>

      <input
        matInput
        formControlName="fullName">

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>

      <input
        matInput
        type="email"
        formControlName="email">

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Phone</mat-label>

      <input
        matInput
        formControlName="phone">

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Specialization</mat-label>

      <input
        matInput
        formControlName="specialization">

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Salary</mat-label>

      <input
        matInput
        type="number"
        formControlName="salary">

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Joining Date</mat-label>

      <input
        matInput
        [matDatepicker]="picker"
        formControlName="joiningDate">

      <mat-datepicker-toggle
        matSuffix
        [for]="picker">
      </mat-datepicker-toggle>

      <mat-datepicker
        #picker>
      </mat-datepicker>

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>

      <mat-select
        formControlName="status">

        <mat-option value="active">
          Active
        </mat-option>

        <mat-option value="inactive">
          Inactive
        </mat-option>

      </mat-select>

    </mat-form-field>

  </div>

  <mat-form-field
    appearance="outline"
    class="notes-field">

    <mat-label>Notes</mat-label>

    <textarea
      matInput
      rows="4"
      formControlName="notes">
    </textarea>

  </mat-form-field>

  <div class="actions">

    <button
      type="button"
      mat-stroked-button
      (click)="cancel.emit()">

      Cancel

    </button>

    <button
      type="submit"
      mat-flat-button>

      Save Trainer

    </button>

  </div>

</form>
