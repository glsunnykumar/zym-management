<form
  class="plan-form"
  [formGroup]="form"
  (ngSubmit)="submit()">

  <div class="form-grid">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Plan Name
      </mat-label>

      <input
        matInput
        formControlName="name">

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Duration (Days)
      </mat-label>

      <input
        type="number"
        matInput
        formControlName="durationDays">

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Price
      </mat-label>

      <input
        type="number"
        matInput
        formControlName="price">

    </mat-form-field>

  </div>

  <mat-form-field
    appearance="outline"
    class="full-width">

    <mat-label>
      Description
    </mat-label>

    <textarea
      rows="4"
      matInput
      formControlName="description">
    </textarea>

  </mat-form-field>

  <mat-slide-toggle
    formControlName="isActive">

    Active Plan

  </mat-slide-toggle>

  <div class="form-actions">


     <button
    type="button"
    mat-stroked-button
    (click)="onCancel()">

    Cancel

  </button>

    <button
      type="submit"
      mat-flat-button
      color="primary">

      Save Plan

    </button>



  </div>

</form>
