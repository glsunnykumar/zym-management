<div class="login-page">




  <mat-card class="login-card">

    <div class="logo-section">

      <mat-icon>
        fitness_center
      </mat-icon>

      <h1>
        GymFlow
      </h1>

      <p>
        Gym Management System
      </p>

    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="login()">

      <mat-form-field
        appearance="outline">

        <mat-label>
          Email
        </mat-label>

        <input
          matInput
          formControlName="email">

        <mat-icon matSuffix>
          mail
        </mat-icon>

      </mat-form-field>

      <mat-form-field
        appearance="outline">

        <mat-label>
          Password
        </mat-label>

        <input
          matInput

          [type]="
            hidePassword()
              ? 'password'
              : 'text'
          "

          formControlName="password">

        <button
          mat-icon-button
          matSuffix
          type="button"

          (click)="
            hidePassword.set(
              !hidePassword()
            )
          ">

          <mat-icon>

            {{
              hidePassword()
                ? 'visibility'
                : 'visibility_off'
            }}

          </mat-icon>

        </button>

      </mat-form-field>

      <button
        mat-raised-button

        color="primary"

        class="login-button"

        [disabled]="loading()">

        {{
          loading()
            ? 'Signing In...'
            : 'Login'
        }}

      </button>

    </form>

  </mat-card>

</div>
