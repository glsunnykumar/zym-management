<gf-page-layout>

  <gf-page-header
    title="Payments"
    subtitle="Manage gym payments">

    <button
      mat-flat-button
      color="primary"
      (click)="onAddPayment()">

      <mat-icon>
        add
      </mat-icon>

      Add Payment

    </button>

  </gf-page-header>

  <gf-search-toolbar>

    <mat-form-field appearance="outline">

      <mat-label>
        Search
      </mat-label>

      <input
        matInput

        [value]="search()"

        (input)="search.set(
          $any($event.target).value
        )">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Status
      </mat-label>

      <mat-select

        [value]="statusFilter()"

        (valueChange)="
          statusFilter.set($event)
        ">

        <mat-option value="">
          All
        </mat-option>

        <mat-option value="paid">
          Paid
        </mat-option>

        <mat-option value="pending">
          Pending
        </mat-option>

        <mat-option value="overdue">
          Overdue
        </mat-option>

      </mat-select>

    </mat-form-field>

  </gf-search-toolbar>

  <gf-data-table

    [columns]="columns"

    [rows]="paymentsVm()"

    [actions]="actions"

    [pageSize]="10"

    [total]="filteredPayments().length"

    (tableEvent)="
      onTableEvent($event)
    ">

  </gf-data-table>

</gf-page-layout>
