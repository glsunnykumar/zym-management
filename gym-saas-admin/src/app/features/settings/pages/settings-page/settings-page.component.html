<gf-page-layout>

    <gf-page-header title="Settings" subtitle="Manage gym information">
    </gf-page-header>

    <form [formGroup]="form" (ngSubmit)="save()">

        <mat-card>

            <mat-card-header>

                <mat-card-title>
                    Gym Information
                </mat-card-title>

            </mat-card-header>

            <mat-card-content>

                <div class="grid">

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Gym Name
                        </mat-label>

                        <input matInput formControlName="gymName">

                    </mat-form-field>

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Owner Name
                        </mat-label>

                        <input matInput formControlName="ownerName">

                    </mat-form-field>

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Email
                        </mat-label>

                        <input matInput formControlName="email">

                    </mat-form-field>

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Phone
                        </mat-label>

                        <input matInput formControlName="phone">

                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">

                        <mat-label>
                            Address
                        </mat-label>

                        <textarea matInput rows="3" formControlName="address">
            </textarea>

                    </mat-form-field>

                </div>

            </mat-card-content>

        </mat-card>

        <mat-card>

            <mat-card-header>

                <mat-card-title>
                    Branding
                </mat-card-title>

            </mat-card-header>

            <mat-card-content>

                <div class="logo-section">

                    @if(logoPreview()) {

                    <img [src]="logoPreview()" alt="Logo" class="logo-preview">

                    }

                    <input type="file" accept="image/*" (change)="onLogoSelected($event)">

                </div>

            </mat-card-content>

        </mat-card>

        <mat-card>

            <mat-card-header>

                <mat-card-title>
                    Preferences
                </mat-card-title>

            </mat-card-header>

            <mat-card-content>

                <div class="grid">

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Currency
                        </mat-label>

                        <mat-select formControlName="currency">

                            <mat-option value="INR">
                                INR
                            </mat-option>

                            <mat-option value="USD">
                                USD
                            </mat-option>

                            <mat-option value="EUR">
                                EUR
                            </mat-option>

                        </mat-select>

                    </mat-form-field>

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Theme
                        </mat-label>

                        <mat-select formControlName="theme">

                            <mat-option value="light">
                                Light
                            </mat-option>

                            <mat-option value="dark">
                                Dark
                            </mat-option>

                        </mat-select>

                    </mat-form-field>

                </div>

            </mat-card-content>

        </mat-card>

        <div class="actions">

            <button mat-raised-button color="primary" type="submit" [disabled]="loading()">

                {{
                loading()
                ? 'Saving...'
                : 'Save Settings'
                }}

            </button>

        </div>

    </form>

</gf-page-layout>
