<gf-page-layout>

  <gf-page-header
    title="Attendance"
    subtitle="Manage attendance">

    <button
      mat-flat-button
      color="primary"
      (click)="onAddAttendance()">

      + Add Attendance

    </button>

  </gf-page-header>

  <gf-search-toolbar>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Search
      </mat-label>

      <input
        matInput

        [value]="search()"

        (input)="
          search.set(
            $any($event.target).value
          )">

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Status
      </mat-label>

      <mat-select

        [value]="
          statusFilter()
        "

        (valueChange)="
          statusFilter.set($event)
        ">

        <mat-option value="">
          All
        </mat-option>

        <mat-option
          value="present">

          Present

        </mat-option>

        <mat-option
          value="absent">

          Absent

        </mat-option>

      </mat-select>

    </mat-form-field>

  </gf-search-toolbar>

  <gf-data-table

    [rows]="
      filteredAttendance()
    "

    [columns]="
      columns
    "

    [actions]="
      actions
    "

    (tableEvent)="
      onTableEvent($event)
    ">

  </gf-data-table>

</gf-page-layout>
