<gf-page-layout>

  @if (attendance(); as attendance) {

    <gf-page-header

      title="Attendance Details"

      [subtitle]="
        member()?.name ??
        'Member'
      ">

      <button
        mat-stroked-button
        color="warn"
        (click)="deleteAttendance()">

        Delete

      </button>

      <button
        mat-flat-button
        color="primary"
        (click)="editAttendance()">

        Edit

      </button>

    </gf-page-header>

    <div class="details-card">

      <div class="detail-row">

        <span class="label">
          Member
        </span>

        <span class="value">
          {{ member()?.name }}
        </span>

      </div>

      <div class="detail-row">

        <span class="label">
          Attendance Date
        </span>

        <span class="value">
          {{ attendance.date }}
        </span>

      </div>

      <div class="detail-row">

        <span class="label">
          Check In
        </span>

        <span class="value">
          {{ attendance.checkInTime }}
        </span>

      </div>

      <div class="detail-row">

        <span class="label">
          Check Out
        </span>

        <span class="value">
          {{ attendance.checkOutTime || '-' }}
        </span>

      </div>

      <div class="detail-row">

        <span class="label">
          Status
        </span>

        <span class="value">
          {{ attendance.status }}
        </span>

      </div>

      <div
        class="detail-row"
        *ngIf="attendance.notes">

        <span class="label">
          Notes
        </span>

        <span class="value">
          {{ attendance.notes }}
        </span>

      </div>

    </div>

  }

</gf-page-layout>
