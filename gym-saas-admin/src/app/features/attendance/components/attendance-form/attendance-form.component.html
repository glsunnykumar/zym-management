<form
  [formGroup]="form"
  (ngSubmit)="submit()">

  <div class="form-grid">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Member
      </mat-label>

      <mat-select
        formControlName="memberId">

        <mat-option
          *ngFor="let member of members"
          [value]="member.id">

          {{ member.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Attendance Date
      </mat-label>

      <input
        matInput
        [matDatepicker]="picker"
        formControlName="date">

      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker">
      </mat-datepicker-toggle>

      <mat-datepicker #picker>
      </mat-datepicker>

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Check In Time
      </mat-label>

      <input
        matInput
        type="time"
        formControlName="checkInTime">

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Check Out Time
      </mat-label>

      <input
        matInput
        type="time"
        formControlName="checkOutTime">

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Status
      </mat-label>

      <mat-select
        formControlName="status">

        <mat-option value="present">
          Present
        </mat-option>

        <mat-option value="absent">
          Absent
        </mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>
        Notes
      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="notes">
      </textarea>

    </mat-form-field>

  </div>

  <div class="actions">

    <button
      mat-stroked-button
      type="button"
      (click)="onCancel()">

      Cancel

    </button>

    <button
      mat-flat-button
      color="primary"
      type="submit">

      Save Attendance

    </button>

  </div>

</form>
