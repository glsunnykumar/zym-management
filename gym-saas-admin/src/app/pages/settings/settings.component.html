<div class="settings-page">
  <mat-card class="settings-card">
    <h2>Gym Settings</h2>
    <p>Update your gym branding and profile information.</p>

    <form [formGroup]="form" (ngSubmit)="save()">

      <!-- Logo Preview -->
      <div class="logo-section">
        <img
          [src]="logoPreview || 'assets/default-logo.png'"
          alt="Gym Logo"
          class="logo-preview"
        />

        <input
          type="file"
          hidden
          #fileInput
          accept="image/*"
          (change)="onFileSelected($event)"
        />

        <button
          mat-stroked-button
          type="button"
          (click)="fileInput.click()">
          <mat-icon>upload</mat-icon>
          Upload Logo
        </button>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Gym Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Short Description</mat-label>
        <textarea
          matInput
          rows="3"
          formControlName="description">
        </textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone Number</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <textarea
          matInput
          rows="2"
          formControlName="address">
        </textarea>
      </mat-form-field>


      <!-- Payment Details -->
<mat-card class="payment-card">
  <h3>Payment Details</h3>
  <p>Configure how customers can pay your gym.</p>

  <mat-form-field appearance="outline">
    <mat-label>UPI ID</mat-label>
    <input matInput formControlName="upiId" placeholder="yourgym@upi" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Account Holder Name</mat-label>
    <input matInput formControlName="accountHolder" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Bank Name</mat-label>
    <input matInput formControlName="bankName" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Account Number</mat-label>
    <input matInput formControlName="accountNumber" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>IFSC Code</mat-label>
    <input matInput formControlName="ifsc" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Razorpay Key ID (Optional)</mat-label>
    <input matInput formControlName="razorpayKeyId" />
  </mat-form-field>
</mat-card>

      <button
        mat-raised-button
        color="primary"
        class="save-btn"
        [disabled]="loading">
        <mat-icon>save</mat-icon>
        {{ loading ? 'Saving...' : 'Save Settings' }}
      </button>

    </form>
  </mat-card>
</div>
