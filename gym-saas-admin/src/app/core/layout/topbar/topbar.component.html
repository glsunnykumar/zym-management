<mat-toolbar class="topbar">

  <button mat-icon-button (click)="layout.toggleSidebar()">

    <mat-icon>menu</mat-icon>

  </button>


  

  <div class="page-title">

    <h2>{{ navigation.title() }}</h2>

    @if (navigation.subtitle()) {
    <!-- <span>{{ navigation.subtitle() }}</span> -->
     <span></span>
    }

  </div>

  <span class="spacer"></span>

  <button mat-icon-button>
    <mat-icon>search</mat-icon>
  </button>

  <button mat-icon-button>
    <mat-icon>notifications</mat-icon>
  </button>

  <button mat-icon-button (click)="theme.toggleDarkMode()">

    <mat-icon>
      {{ theme.isDarkMode() ? 'light_mode' : 'dark_mode' }}
    </mat-icon>

  </button>



<mat-menu #notificationMenu="matMenu">

  @if (notifications().length === 0) {

    <div class="notification-empty">

      No Notifications

    </div>

  }

  @for (
    item of notifications();
    track item.id
  ) {

    <button
      mat-menu-item
      (click)="markAsRead(item)">

      <div class="notification-item">

        <div class="notification-title">

          {{ item.memberName }}

        </div>

        <div class="notification-message">

          {{ item.message }}

        </div>

      </div>

    </button>

  }

</mat-menu>

<button
  mat-icon-button
  [matBadge]="notifications().length"
  matBadgeColor="warn"
  [matMenuTriggerFor]="notificationMenu">

  <mat-icon>notifications</mat-icon>

</button>

  <button mat-icon-button [matMenuTriggerFor]="userMenu">

    <mat-icon>account_circle</mat-icon>

  </button>

  <mat-menu #userMenu="matMenu">

   <div class="user-info">

  <strong>
    {{ settings()?.ownerName }}
  </strong>

  <small>
    {{ settings()?.gymName }}
  </small>

  <small>
    {{ settings()?.email }}
  </small>

</div>

    <mat-divider></mat-divider>

    <button mat-menu-item routerLink="/settings">

      <mat-icon>settings</mat-icon>

      <span>Settings</span>

    </button>

    <button mat-menu-item (click)="logout()">

      <mat-icon>logout</mat-icon>

      <span>Logout</span>

    </button>

  </mat-menu>
</mat-toolbar>
